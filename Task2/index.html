<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>My Todo List</h2>
            <input type="text" id="taskInput" placeholder="Enter Your List" onkeypress="handleKeyPress(event)">
            <button type="button" id="addtask" onclick="AddTask()">Add</button>
        </div>
        <ul id="taskList"></ul>

    </div>
    <script async src="todo.js"></script>
</body>
</html>
